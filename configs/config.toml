[app]
name = "echo-admin"
version = "dev"

[system]
port = ":9322"
#1 = debug , 2 = online
level = 1

[log]
# console is convenient for local debug; json is better for production collectors.
format = "console"
output = "stdout"
caller = false

[admin]
upload_dir = "uploads"

[http]
enable_recovery = true
enable_request_context = true
enable_request_log = true
enable_gzip = true
secure_cookies = false

[http.cors]
enabled = false
allow_origins = []
allow_methods = []
allow_headers = []
allow_credentials = false
expose_headers = []
max_age_seconds = 0

[mysql]
# 本地 docker MySQL（huazhu-passenger-mysql:3307），与乘客/司机端同机，
# 不再依赖外网 MySQL（线上实例已拒绝本机 IP）。
enabled = true
host = "127.0.0.1"
port = 3307
database = "echo_admin"
username = "root"
password = "root"
max_open_conns = 25
max_idle_conns = 5
conn_max_lifetime_seconds = 300
ping_timeout_seconds = 3

[redis]
enabled = false
address = ""
username = ""
password = ""
db = 0
dial_timeout_seconds = 3
read_timeout_seconds = 3
write_timeout_seconds = 3
ping_timeout_seconds = 3

[mongodb]
enabled = true
# 与乘客端/司机端（花小猪主项目）共用同一个 MongoDB 实例与库，
# 运营看板的订单统计直接读 passenger_orders 集合。
uri = "mongodb://bw:bw-secret@127.0.0.1:27018/?authSource=admin"
database = "huazhu"
connect_timeout_seconds = 5
ping_timeout_seconds = 5

[tracing]
enabled = false
endpoint = ""
protocol = "grpc"
insecure = true
service_name = ""
sample_ratio = 1.0
shutdown_timeout_seconds = 5
